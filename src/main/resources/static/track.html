<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Grievances</title>
    <style>
        /* Pure Dark Theme - No External Links */
        body, html {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117; color: #c9d1d9; min-height: 100vh;
        }

        /* Navbar */
        .navbar { background: #161b22; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .navbar-brand { color: #58a6ff; font-size: 20px; font-weight: bold; text-decoration: none; }
        .nav-links { display: inline-flex; align-items: center; margin-left: 20px; }
        .nav-links a { color: #c9d1d9; text-decoration: none; margin: 0 15px; font-weight: 500; transition: color 0.2s;}
        .nav-links a:hover { color: #58a6ff; }

        /* FIX: Dropdown no longer disappears */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { padding: 10px 0; }
        .dropdown-content {
            display: none; position: absolute; background-color: #161b22; min-width: 170px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.6); z-index: 10; border: 1px solid #30363d;
            border-radius: 8px; overflow: hidden; top: 100%; left: 0;
            margin-top: -5px; /* Overlaps slightly */
        }
        .dropdown-content a { color: #c9d1d9; padding: 12px 16px; text-decoration: none; display: block; margin: 0; }
        .dropdown-content a:hover { background-color: #30363d; color: #58a6ff; }
        .dropdown:hover .dropdown-content { display: block; }

        .user-controls { display: flex; align-items: center; gap: 20px; color: #8b949e; }
        .btn-logout { background: transparent; color: #da3633; border: 1px solid #da3633; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;}
        .btn-logout:hover { background: #da3633; color: white; }

        /* Dashboard Styles */
        .container { max-width: 800px; margin: 50px auto; padding: 0 20px; }
        .dashboard-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); }
        .dashboard-card h2 { margin-top: 0; color: #ffffff; margin-bottom: 30px; font-size: 24px; }
        .grievance-item { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 25px; margin-bottom: 25px; }
        .g-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .dept-badge { background: #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .btn-delete { background: #da3633; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-delete:hover { background: #b62324; }
        .g-title { color: #ffffff; font-size: 22px; margin: 0 0 5px 0; }
        .g-desc { color: #c9d1d9; font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
        .status-badge { display: inline-block; background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.4); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; }
        .status-resolved { background: rgba(35, 134, 54, 0.15); color: #3fb950; border: 1px solid rgba(35, 134, 54, 0.4); }
    </style>
</head>
<body>

<div class="navbar">
    <div>
        <a href="#" class="navbar-brand">🏛️ Grievance Tracker</a>
        <span class="nav-links">
                <a href="/home.html">Home</a>
                <div class="dropdown">
                    <a href="#" class="dropbtn">Grievances ▾</a>
                    <div class="dropdown-content">
                        <a href="/file.html">File a Grievance</a>
                        <a href="/track.html">Track Progress</a>
                    </div>
                </div>
            </span>
    </div>
    <div class="user-controls">
        <span id="userNameDisplay">Hi, Citizen</span>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div class="dashboard-card">
        <h2>My Filed Grievances</h2>
        <div id="grievanceList">
            <p style="color:#8b949e;">Loading your history...</p>
        </div>
    </div>
</div>

<script>
    const currentUser = localStorage.getItem("currentUser");
    if (currentUser) {
        document.getElementById("userNameDisplay").innerText = "Hi, " + currentUser;
    } else {
        window.location.href = "/";
    }

    // Fix: Working Logout Function
    function logout() {
        localStorage.clear();
        window.location.href = "/";
    }

    // Fetch user grievances
    function loadGrievances() {
        fetch(`/api/grievances/user/${currentUser}`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById("grievanceList");
                list.innerHTML = "";

                if(data.length === 0) {
                    list.innerHTML = "<p style='color:#8b949e;'>You have not submitted any grievances yet.</p>";
                    return;
                }

                data.forEach(g => {
                    const isResolved = g.status === 'RESOLVED';
                    list.innerHTML += `
                            <div class="grievance-item" id="grievance-${g.id}">
                                <div class="g-header">
                                    <span class="dept-badge">🏛️ ${g.department || 'General'}</span>
                                    <button class="btn-delete" onclick="deleteGrievance(${g.id})">Delete</button>
                                </div>
                                <h3 class="g-title">${g.title}</h3>
                                <p class="g-desc">${g.description}</p>
                                <div class="status-badge ${isResolved ? 'status-resolved' : ''}">STATUS: ${g.status}</div>
                            </div>
                        `;
                });
            }).catch(err => console.error("Error loading grievances:", err));
    }

    function deleteGrievance(id) {
        if (confirm("Are you sure you want to delete this grievance?")) {
            fetch(`/api/grievances/${id}`, { method: 'DELETE' })
                .then(res => {
                    if (res.ok) {
                        document.getElementById(`grievance-${id}`).remove();
                    } else {
                        alert("Failed to delete grievance.");
                    }
                });
        }
    }

    loadGrievances();
</script>
</body>
</html>
