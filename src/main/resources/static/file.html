<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File a Grievance</title>
    <style>
        /* Pure Dark Theme - No External Links */
        body, html {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117; color: #c9d1d9; min-height: 100vh;
        }

        /* Navbar */
        .navbar { background: #161b22; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .navbar-brand { color: #58a6ff; font-size: 20px; font-weight: bold; text-decoration: none; }
        .nav-links { display: inline-flex; align-items: center; margin-left: 20px; }
        .nav-links a { color: #c9d1d9; text-decoration: none; margin: 0 15px; font-weight: 500; transition: color 0.2s;}
        .nav-links a:hover { color: #58a6ff; }

        /* FIX: Dropdown no longer disappears */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { padding: 10px 0; } /* Invisible bridge for mouse */
        .dropdown-content {
            display: none; position: absolute; background-color: #161b22; min-width: 170px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.6); z-index: 10; border: 1px solid #30363d;
            border-radius: 8px; overflow: hidden; top: 100%; left: 0;
            margin-top: -5px; /* Overlaps slightly to stop it from closing */
        }
        .dropdown-content a { color: #c9d1d9; padding: 12px 16px; text-decoration: none; display: block; margin: 0; }
        .dropdown-content a:hover { background-color: #30363d; color: #58a6ff; }
        .dropdown:hover .dropdown-content { display: block; }

        .user-controls { display: flex; align-items: center; gap: 20px; color: #8b949e; }
        .btn-logout { background: transparent; color: #da3633; border: 1px solid #da3633; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;}
        .btn-logout:hover { background: #da3633; color: white; }

        /* Content Card */
        .container { max-width: 650px; margin: 50px auto; padding: 0 20px; }
        .form-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); }
        .form-card h2 { margin-top: 0; color: #ffffff; margin-bottom: 30px; font-size: 24px; }
        input, select, textarea { width: 100%; padding: 16px 20px; background: #0d1117; border: 2px solid #30363d; color: #ffffff; border-radius: 10px; font-size: 15px; box-sizing: border-box; margin-bottom: 20px; font-family: inherit; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #58a6ff; }
        textarea { resize: vertical; min-height: 150px; }
        .btn-submit { background: #238636; color: white; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-submit:hover { background: #2ea043; }
    </style>
</head>
<body>

<div class="navbar">
    <div>
        <a href="#" class="navbar-brand">🏛️ Grievance Tracker</a>
        <span class="nav-links">
                <a href="/home.html">Home</a>
                <div class="dropdown">
                    <a href="#" class="dropbtn">Grievances ▾</a>
                    <div class="dropdown-content">
                        <a href="/file.html">File a Grievance</a>
                        <a href="/track.html">Track Progress</a>
                    </div>
                </div>
            </span>
    </div>
    <div class="user-controls">
        <span id="userNameDisplay">Hi, Citizen</span>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div class="form-card">
        <h2>Report an Issue</h2>
            <select id="department">
                <option>-- Select a Department --</option>
                <option>Public Works & Roads(Potholes, Traffic Lights)</option>
                <option>Water & Sanitation(Leaks, Sewage)</option>
                <option>Electricity & Power(Outages, Wires)</option>
                <option>Waste Management(Garbage, Bins)</option>
                <option>Public Health & Safety(Hazards, Noise)</option>
                <option>Other / General</option>
            </select>
        </select>
        <input type="text" id="title" placeholder="Short Title (e.g., Broken Pipe)">
        <textarea id="details" placeholder="Provide details here..."></textarea>
        <button class="btn-submit" onclick="submitGrievance()">Submit to Authorities</button>
    </div>
</div>

<script>
    // Setup username display
    const currentUser = localStorage.getItem("currentUser");
    if (currentUser) {
        document.getElementById("userNameDisplay").innerText = "Hi, " + currentUser;
    } else {
        window.location.href = "/";
    }

    // Fix: Working Logout Function
    function logout() {
        localStorage.clear();
        window.location.href = "/";
    }

    // Fix: Database Submission logic
    function submitGrievance() {
        const title = document.getElementById("title").value.trim();
        const desc = document.getElementById("details").value.trim();
        // 1. Grab the department value
        const dept = document.getElementById("department").value;

        // 2. Make sure they didn't leave the dropdown on the default text
        if (dept === "-- Select a Department --") return alert("Please select a department.");
        if (!title || !desc) return alert("Please fill out all fields.");

        const payload = {
            title: title,
            description: desc,
            department: dept, // 3. Send the department to your Java backend
            status: "PENDING",
            user: { username: currentUser }
        };

        fetch('/api/grievances', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(res => {
            if(res.ok) {
                alert("Grievance submitted successfully!");
                window.location.href = "/track.html";
            } else {
                alert("Failed to submit grievance.");
            }
        });
    }
</script>
</body>
</html>
