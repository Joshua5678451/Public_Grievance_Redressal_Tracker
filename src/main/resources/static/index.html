<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grievance Tracker - Login</title>
    <style>
        /* Base Styling */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
            background: linear-gradient(rgba(13, 17, 23, 0.85), rgba(13, 17, 23, 0.95)),
            url('https://images.unsplash.com/photo-1449844908441-8829872d2607?q=80&w=2070&auto=format&fit=crop') center/cover fixed no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Frosted Glass Card Container - WIDENED to 650px, but SHORTER vertically */
        .login-card {
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #30363d;
            padding: 40px 50px; /* Reduced top/bottom padding to make it shorter */
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            color: #c9d1d9;
            text-align: center;
            margin: auto;
        }

        .brand-title {
            color: #58a6ff;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 5px; /* Tighter spacing */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
        }

        .subtitle {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 25px; /* Tighter spacing */
        }

        /* Form Inputs & Elements */
        .input-group {
            margin-bottom: 16px; /* Tighter spacing between boxes */
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px; /* Tighter spacing */
            color: #8b949e;
        }

        /* Reduced vertical thickness of the typing boxes */
        input, select {
            width: 100%;
            padding: 14px 16px; /* Reduced vertical padding */
            background: #0d1117;
            border: 2px solid #30363d;
            color: #ffffff;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        /* Modern SVG Password Eye Button */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            padding-right: 50px;
        }

        .eye-btn {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: #8b949e;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .eye-btn:hover { color: #58a6ff; }

        .eye-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Captcha Section */
        .captcha-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 10px 0;
            background: #0d1117;
            padding: 10px;
            border: 2px solid #30363d;
            border-radius: 10px;
        }

        canvas {
            background: #ffffff;
            border-radius: 6px;
            cursor: pointer;
        }

        .refresh-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 20px;
            transition: color 0.2s;
        }
        .refresh-btn:hover { color: #58a6ff; }

        /* Action Buttons */
        .btn-submit {
            width: 100%;
            padding: 14px; /* Reduced vertical thickness */
            background: #238636;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #2ea043; }

        /* Footer Links */
        .card-footer {
            margin-top: 20px;
            font-size: 14px;
            color: #8b949e;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-footer a {
            color: #58a6ff;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
            font-weight: 600;
        }
        .card-footer a:hover { text-decoration: underline; color: #79c0ff; }

        /* Hidden Utility Class */
        .hidden { display: none; }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            .brand-title {
                font-size: 24px;
                white-space: normal;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-title">🏛️ Grievance Tracker</div>
    <div class="subtitle" id="formSubtitle">Secure Portal Access</div>

    <!-- LOGIN FORM -->
    <div id="loginSection">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="loginUser" placeholder="Enter your username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="password-container">
                <input type="password" id="loginPass" placeholder="Enter your password">
                <button type="button" class="eye-btn" onclick="togglePassword('loginPass', this)" title="Show/Hide Password">
                    <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>

        <div class="input-group">
            <label>Verification Captcha</label>
            <div class="captcha-box">
                <!-- FIX: Widened canvas from 120 to 140 so it doesn't get cut off -->
                <canvas id="captchaCanvas" width="140" height="40"></canvas>
                <button type="button" class="refresh-btn" onclick="drawCaptcha()" title="Refresh Captcha">🔄</button>
            </div>
            <!-- FIX: Updated Placeholder -->
            <input type="text" id="captchaInput" placeholder="Enter the captcha above">
        </div>

        <button class="btn-submit" onclick="login()">Sign In</button>

        <div class="card-footer">
            <div>Don't have an account? <a onclick="showSignup()">Sign Up</a></div>
            <div><a onclick="showForgot()">Forgot Password?</a></div>
        </div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupSection" class="hidden">
        <div class="input-group">
            <label>Choose Username</label>
            <input type="text" id="signupUser" placeholder="Choose a username">
        </div>
        <div class="input-group">
            <label>Choose Password</label>
            <div class="password-container">
                <input type="password" id="signupPass" placeholder="Create a password">
                <button type="button" class="eye-btn" onclick="togglePassword('signupPass', this)" title="Show/Hide Password">
                    <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>
        <div class="input-group">
            <label>Security Question</label>
            <select id="signupQ">
                <option value="What is your pet's name?">What is your pet's name?</option>
                <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                <option value="What city were you born in?">What city were you born in?</option>
            </select>
        </div>
        <div class="input-group">
            <label>Security Answer</label>
            <input type="text" id="signupA" placeholder="Answer to question">
        </div>

        <button class="btn-submit" style="background:#1f6feb;" onclick="signup()">Create Account</button>

        <div class="card-footer">
            <div>Already have an account? <a onclick="showLogin()">Sign In</a></div>
        </div>
    </div>

    <!-- FORGOT PASSWORD FORM -->
    <div id="forgotSection" class="hidden">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="forgotUser" placeholder="Enter your username">
        </div>
        <div class="input-group">
            <label>Security Answer</label>
            <input type="text" id="forgotA" placeholder="Enter your security answer">
        </div>
        <div class="input-group">
            <label>New Password</label>
            <div class="password-container">
                <input type="password" id="forgotNewPass" placeholder="Enter new password">
                <button type="button" class="eye-btn" onclick="togglePassword('forgotNewPass', this)" title="Show/Hide Password">
                    <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>

        <button class="btn-submit" style="background:#8957e5;" onclick="resetPassword()">Reset Password</button>

        <div class="card-footer">
            <div>Remembered your password? <a onclick="showLogin()">Sign In</a></div>
        </div>
    </div>
</div>

<script>
    let currentCaptchaText = "";

    function togglePassword(inputId, buttonElement) {
        const passInput = document.getElementById(inputId);
        const openEyeSVG = '<svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        const closedEyeSVG = '<svg class="eye-icon" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

        if (passInput.type === "password") {
            passInput.type = "text";
            buttonElement.innerHTML = closedEyeSVG;
        } else {
            passInput.type = "password";
            buttonElement.innerHTML = openEyeSVG;
        }
    }
    // Listen for "Enter" key presses on the login form
    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            // If the login section is currently visible, trigger the login function
            if (!document.getElementById("loginSection").classList.contains("hidden")) {
                login();
            }
        }
    });

    function drawCaptcha() {
        const canvas = document.getElementById("captchaCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        currentCaptchaText = "";
        for (let i = 0; i < 5; i++) {
            currentCaptchaText += chars.charAt(Math.floor(Math.random() * chars.length));
        }

        // FIX: Slightly smaller font and adjusted spacing so it easily fits inside the 140px width
        ctx.font = "bold 22px Arial";
        ctx.fillStyle = "#333";
        ctx.letterSpacing = "4px";
        ctx.fillText(currentCaptchaText, 20, 28);

        ctx.strokeStyle = "#888";
        for(let i=0; i<3; i++) {
            ctx.beginPath();
            ctx.moveTo(Math.random()*canvas.width, Math.random()*canvas.height);
            ctx.lineTo(Math.random()*canvas.width, Math.random()*canvas.height);
            ctx.stroke();
        }
    }

    function showSignup() {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("forgotSection").classList.add("hidden");
        document.getElementById("signupSection").classList.remove("hidden");
        document.getElementById("formSubtitle").innerText = "Create New Citizen Account";
    }

    function showForgot() {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("signupSection").classList.add("hidden");
        document.getElementById("forgotSection").classList.remove("hidden");
        document.getElementById("formSubtitle").innerText = "Password Recovery";
    }

    function showLogin() {
        document.getElementById("signupSection").classList.add("hidden");
        document.getElementById("forgotSection").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("formSubtitle").innerText = "Secure Portal Access";
        drawCaptcha();
    }

    function login() {
        const u = document.getElementById("loginUser").value.trim();
        const p = document.getElementById("loginPass").value.trim();
        const c = document.getElementById("captchaInput").value.trim();

        if(!u || !p || !c) return alert("Please fill in all fields!");
        if(c.toUpperCase() !== currentCaptchaText) {
            alert("Incorrect Captcha! Please try again.");
            drawCaptcha();
            return;
        }

        fetch('/api/users/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        }).then(async res => {
            if(res.ok) {
                const data = await res.json();
                localStorage.setItem("currentUser", data.username);
                localStorage.setItem("role", data.role);
                if(data.role === "ADMIN") window.location.href = "/admin.html";
                else window.location.href = "/home.html";
            } else {
                const err = await res.text();
                alert(err || "Invalid credentials.");
                drawCaptcha();
            }
        });
    }

    function signup() {
        const u = document.getElementById("signupUser").value.trim();
        const p = document.getElementById("signupPass").value.trim();
        const q = document.getElementById("signupQ").value;
        const a = document.getElementById("signupA").value.trim();

        if(!u || !p || !a) return alert("Please fill out all signup fields!");

        fetch('/api/users/signup', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p, securityQuestion: q, securityAnswer: a })
        }).then(async res => {
            if(res.ok) {
                alert("Account created successfully! Please sign in.");
                showLogin();
            } else {
                const err = await res.text();
                alert(err || "Signup failed.");
            }
        });
    }

    function resetPassword() {
        const u = document.getElementById("forgotUser").value.trim();
        const a = document.getElementById("forgotA").value.trim();
        const p = document.getElementById("forgotNewPass").value.trim();

        if(!u || !a || !p) return alert("Please fill out all fields!");

        fetch('/api/users/reset-password', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, securityAnswer: a, password: p })
        }).then(async res => {
            if(res.ok) {
                alert("Password reset successfully! You can now log in.");
                showLogin();
            } else {
                const err = await res.text();
                alert(err || "Reset failed.");
            }
        });
    }

    drawCaptcha();
</script>
</body>
</html>
